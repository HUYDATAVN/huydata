<noscript id="nojs-content"><h1>Cứ lo bán hàng, sổ sách đã có HuyData.</h1>
<p>Từ 01/01/2026, thuế khoán bị bãi bỏ. Hộ kinh doanh phải tự ghi sổ, tự kê khai, tự nộp thuế theo doanh thu thực tế. HuyData mang tới giải pháp CaPi — Sổ doanh thu cùng người hướng dẫn tận nơi, để anh chị ghi đúng, ghi đủ, không phải tự mò.</p>
<p>HuyData — Giải pháp ghi sổ cho hộ kinh doanh. Cứ lo bán hàng, sổ sách đã có HuyData Giải pháp thông minh · Vận hành tinh gọn</p>
<h2>Từ 2026, không còn thuế khoán nữa</h2>
<p>Trước đây, hộ kinh doanh đóng thuế khoán theo một mức cố định nên nhiều cô chú anh chị không phải bận tâm nhiều đến việc ghi chép doanh thu. Từ năm 2026, cách làm thay đổi: doanh thu bán hàng cần được ghi nhận đầy đủ để kê khai và thực hiện nghĩa vụ thuế theo số thực tế phát sinh.</p>
<ul><li>Phải tự ghi sổ, tự kê khai — Việc trước giờ chưa từng làm, nay thành bắt buộc mỗi tháng, mỗi năm.</li><li>Làm sai, làm trễ là bị phạt — Không biết mình sai ở đâu — đó là nỗi lo lớn nhất.</li><li>Không rành máy tính, không rành kế toán — Bận bán hàng cả ngày, lấy đâu thời gian học sổ sách.</li><li>Dưới 1 tỷ tưởng khỏi lo — mà không phải — Được miễn thuế nhưng vẫn phải ghi sổ và kê khai để chứng minh dưới ngưỡng.</li></ul>
<h2>Giải pháp đi kèm người hướng dẫn thật</h2>
<p>Bốn điều làm nên khác biệt — cũng là bốn lời hứa HuyData giữ với anh chị.</p>
<ul><li>Người địa phương, gặp tận nơi — Cộng tác viên là người trong vùng, tới tận nhà hướng dẫn — không phải tổng đài xa lạ.</li><li>HuyData làm sẵn cho anh chị — Định danh và danh mục mặt hàng đã thiết lập trước. Không cần biết máy tính, không cần biết kế toán.</li><li>Chuyên môn thật — 20 năm trong nghề kế toán – thuế cùng nền tảng thống kê. Dân chuyên môn, không phải công ty phần mềm bán xong để đó.</li><li>Đồng hành liên tục, đúng hạn — Mỗi tháng, mỗi quý, mỗi năm đều có người nhắc và hỗ trợ — không bỏ giữa chừng.</li></ul>
<h2>HuyData lo những gì? — Giải pháp CaPi</h2>
<p>CaPi – Ghi doanh thu, đơn giản như bán hàng mỗi ngày

Không cần học kế toán, không cần làm quen với phần mềm phức tạp. Mỗi ngày anh chị chỉ cần ghi món hàng và số tiền bán được bằng điện thoại. Cuối tháng bấm gửi dữ liệu cho HuyData, phần còn lại để HuyData hỗ trợ.

Bán hàng như mọi ngày. Ghi doanh thu cho đúng. Phần còn lại, để HuyData lo.</p>
<h3>Giải pháp CaPi</h3>
<p>Ghi sổ doanh thu và nhắc hạn trọn gói. Mỗi ngày anh chị chỉ ghi doanh thu vào điện thoại và gõ số tiền, vô cùng đơn giản.</p>
<ul><li>CaPi — Hộ dưới 1 tỷ — Mỗi ngày, anh chị chỉ cần ghi lại doanh thu bán hàng theo cách thuận tiện nhất. Cuối tháng, HuyData tổng hợp sổ và nhắc anh chị những việc cần thực hiện đúng hạn, để anh chị yên tâm tập trung vào việc kinh doanh.</li><li>CaPi — Hộ trên 1 tỷ — Anh chị liên hệ HuyData để trao đổi</li></ul>
<h3>Công cụ đi kèm</h3>
<p>Vài công cụ nhỏ giúp việc sổ sách nhẹ hơn — nhắc tới khi anh chị cần.</p>
<ul><li>App tải hóa đơn điện tử — Tải và quản lý hóa đơn điện tử đầu vào hàng loạt cho doanh nghiệp, hộ kinh doanh và kế toán dịch vụ nhiều đầu mối. Không phải mở từng hóa đơn để tải, gom và quản lý tập trung, đỡ mất thời gian làm thủ công, không lo bỏ sót hóa đơn.</li><li>Hỗ trợ đăng ký hộ kinh doanh — Đăng ký kinh doanh cho hộ cá thể, anh chị chỉ cần cung cấp thông tin cơ bản. Phần hồ sơ, thủ tục để Huy lo, anh chị không phải tự đi tìm hiểu từng bước.</li></ul>
<h2>Chi phí — rõ ràng, theo quy mô hộ</h2>
<p>Chỉ một gói đồng hành duy nhất, theo quy mô hộ. Phí thiết lập một lần 200.000 – 300.000đ/hộ — HuyData làm sẵn định danh và danh mục mặt hàng.</p>
<ul><li>Đồng Hành: 275.000đ / tháng · hộ dưới 1 tỷ — Ghi sổ doanh thu hằng tháng, nhắc hạn cả năm và có người đồng hành — chưa tới ly cà phê mỗi ngày.</li><li>Theo Quý: Liên hệ hộ trên 1 tỷ · tự xuất HĐ — Sổ sách theo quý cho hộ trên 1 tỷ, có người đồng hành từng kỳ.</li><li>Theo Quý + Hóa Đơn: Liên hệ hộ trên 1 tỷ · cần hóa đơn điện tử — Trọn gói sổ theo quý, kèm hỗ trợ phát hành hóa đơn điện tử.</li><li>Quyết Toán: Liên hệ hộ trên 3 tỷ — Trọn gói kèm tổng hợp số liệu quyết toán năm — khảo sát rồi báo giá riêng.</li></ul>
<p>Từ gói Theo Quý trở lên, mỗi hộ mỗi khác nên khảo sát rồi báo giá riêng — thường rẻ hơn nhiều so với thuê một kế toán riêng (3–5tr/tháng). Nhắn Zalo để được tư vấn gói phù hợp.</p>
<h2>Ghi đúng · Khai đủ · Đúng hạn</h2>
<p>HuyData không thể thay anh chị thực hiện nghĩa vụ với cơ quan thuế, nhưng có thể giúp anh chị chuẩn bị và theo dõi phần việc của mình một cách rõ ràng, đúng hạn. HuyData làm tốt phần mình đảm nhận, để anh chị bớt lo những việc phía sau và yên tâm tập trung kinh doanh.</p>
<ul><li>Ghi đúng — Ghi nhận doanh thu đúng thực tế, đúng cách — nền tảng của mọi việc còn lại.</li><li>Khai đủ — Số liệu đủ để kê khai đúng mẫu, đúng quy định hiện hành.</li><li>Đúng hạn — Nhắc trước hạn từng tháng, từng quý, từng năm — không để trễ.</li></ul>
<h2>HuyData dành cho ai?</h2>
<p>Không phải ai cũng cần giải pháp này. Anh chị đọc thử — nếu thấy mình trong một trong những trường hợp dưới đây thì HuyData giúp được.</p>
<ul><li>Hộ dưới 1 tỷ, chưa từng ghi sổ — Bao năm nay đóng thuế khoán một mức, cứ đến kỳ là đóng, có người đến thu. Giờ chuyển sang kê khai, nhiều cô chú anh chị không biết bắt đầu từ đâu: bán hàng thì ghi cái gì, ghi vô đâu, cuối tháng hay cuối quý mới khai? Những chuyện trước đây không phải bận tâm, giờ lại thành việc phải tự theo dõi.</li><li>Chủ hộ không rành máy tính — Điện thoại chỉ để nghe gọi với Zalo. Con cháu đi làm xa, không ai ở nhà làm giùm giấy tờ.</li><li>Buôn bán lắt nhắt, ngày mấy chục lượt — Tạp hóa, cầm đồ, điện thoại, sửa xe, in ấn, quán ăn — giao dịch nhỏ mà nhiều, ghi tay riết rồi rối, cuối tháng gom lại không nổi.</li><li>Đang được thuế nhắc mà chưa biết làm sao — Đã nhận thông báo hoặc được cán bộ thuế hỏi tới, trong lòng lo mà chưa biết bắt đầu từ đâu.</li><li>Hộ trên 1 tỷ, cần xuất hóa đơn — Doanh thu đã vượt ngưỡng, phải kê khai theo quý và xuất hóa đơn — không muốn tự ôm, cũng chưa tới mức thuê hẳn một kế toán riêng.</li><li>Tôi đã có kế toán, có cần HuyData không? — Nếu kế toán của anh chị đã có sẵn hệ thống để ghi nhận doanh thu, làm sổ và theo dõi đầy đủ thì HuyData có thể hỗ trợ thêm ở những phần anh chị đang cần, chẳng hạn như ghi nhận doanh thu hằng ngày và tổng hợp dữ liệu thuận tiện hơn.

Còn nếu anh chị vẫn phải tự ghi chép doanh thu mỗi ngày rồi gửi lại cho kế toán bằng sổ giấy hoặc phải mở máy tính nhập excel, CaPi có thể giúp phần này nhẹ nhàng hơn rất nhiều.</li></ul>
<h2>Những người đang sử dụng dịch vụ của HuyData</h2>
<p>HuyData đang đồng hành cùng nhiều hộ kinh doanh tại Chợ Lách và các khu vực lân cận. Dưới đây là một số anh chị chủ hộ đã sử dụng dịch vụ và đồng ý chia sẻ trải nghiệm thực tế của mình.

Mỗi người có một công việc, một cách kinh doanh khác nhau. Những chia sẻ này giúp cô chú anh chị hiểu rõ hơn HuyData đang hỗ trợ công việc thực tế như thế nào.</p>
<h3>Cơ sở in Hoa Mai — xã Chợ Lách</h3>
<p>In ấn · Quảng cáo</p>
<p>"Trước giờ tui có làm sổ sách gì đâu, tới kỳ đóng thuế rồi thôi. Giờ bắt ghi chép, kê khai nên cũng hơi ngán. Từ ngày nhờ Huy làm, tui cứ bán hàng rồi ghi lại, có gì không rõ thì hỏi Huy. Đỡ cái là mình không phải tự ngồi mò coi phải làm sao."</p>
<h3>Cầm đồ Huỳnh Nga — xã Chợ Lách</h3>
<p>Dịch vụ cầm đồ</p>
<p>"Giờ quy định thay đổi, trước giờ tui đâu có rành mấy cái vụ ghi chép, kê khai này. Ban đầu cũng lo không biết làm sao cho đúng. Nhờ Huy hướng dẫn rồi làm quen dần, giờ có gì cứ hỏi Huy. Mình làm buôn bán thì lo bán hàng, còn sổ sách có người chỉ cho làm vậy cũng đỡ."</p>

<p>Điện thoại · Phụ kiện · Sửa chữa</p>
<p>“Cửa hàng Sang bán máy, bán phụ kiện, mỗi ngày giao dịch cũng nhiều. Bình thường lúc bán thì ghi lại được, chớ để cuối tháng ngồi gom lại là mệt lắm. Từ ngày làm với HuyData thì đỡ phần đó, tui cứ bán hàng, có gì cần thì bên Huy hướng dẫn. Cái tui thấy tiện là có gì không hiểu hỏi là được, thuế có thay đổi gì Huy cũng báo trước cho biết, chớ tới lúc làm mới biết thì lúc đó rối lắm.”</p>

<p>“Nói thiệt, thuế mấy năm nay đổi hoài, tui đọc cũng không hiểu hết. Nghe nói bỏ thuế khoán, rồi phải tự khai tự làm, nghe tới đó là tui ngán rồi. Tui làm cầm đồ chớ có rành sổ sách đâu. Từ ngày làm với HuyData, có gì mới thì Huy nói lại cho tui dễ hiểu, chỗ nào không biết thì hỏi. Mấy cái này để người rành làm cho chắc, mình lo buôn bán là được.”</p>
<p>Các nhận xét trên do chính chủ hộ xem lại và đồng ý cho HuyData đăng. HuyData không đăng số điện thoại, doanh thu hay bất kỳ số liệu kinh doanh nào của khách.</p>
<h2>Anh chị sẽ được làm việc như thế nào</h2>
<p>Giải pháp là thứ không cầm được trên tay, nên HuyData ghi rõ ra đây từng bước — để anh chị biết trước mình sẽ nhận được gì, ai làm, làm lúc nào.</p>
<ul><li>Bước 1: Gặp mặt, nghe anh chị kể — Cộng tác viên trong xã tới tận nơi, chỉ hỏi anh chị bán gì, mỗi ngày bao nhiêu lượt, đang vướng ở đâu.</li><li>Bước 2: HuyData thiết lập sẵn — HuyData nhập giúp thông tin định danh hộ và toàn bộ danh mục mặt hàng. Anh chị không phải khai báo gì, không phải học phần mềm, không phải học kế toán.</li><li>Bước 3: Hướng dẫn tận nhà — Cầm điện thoại của chính anh chị, chỉ tận tay tới khi tự làm được. Chỉ có hai thao tác: nói tên món hàng hoặc chọn món hàng sau đó gõ số tiền.</li><li>Bước 4: Mỗi ngày ghi doanh thu — Bán xong ghi liền, chừng vài giây. Quên một hôm cũng không sao — ghi bù được.</li><li>Bước 5: Cuối tháng HuyData rà soát — HuyData đối chiếu số liệu, phát hiện chỗ ghi thiếu hoặc bất thường và gọi lại hỏi anh chị cho rõ trước khi chốt sổ.</li><li>Bước 6: Nhận sổ tháng — HuyData gửi sổ doanh thu tháng qua Zalo, kèm vài dòng nhận xét dễ hiểu — tháng này bán khá hơn hay chậm hơn, đang cách ngưỡng bao xa.</li><li>Bước 7: Chuẩn bị sẵn số liệu, nhắc trước hạn — Tới kỳ, HuyData chuẩn bị sẵn số liệu và nhắc anh chị trước hạn. Không để anh chị tự nhớ ngày.</li></ul>
<h3>Sổ tháng anh chị nhận được</h3>
<p>Mỗi tháng HuyData gửi một bản sổ doanh thu qua Zalo. Không phải file lằng nhằng — mở ra là đọc được, cần thì in ra cất.</p>
<h2>Cộng tác viên — người trong xóm, không phải tổng đài</h2>
<p>HuyData có những người cộng tác ngay tại địa phương, quen đường, quen địa bàn và hiểu công việc của cô chú anh chị. Có gì cần hỏi, cần hỗ trợ thì cứ liên hệ người phụ trách gần mình, cần thiết có thể gặp trực tiếp, không phải gọi tổng đài rồi chờ đợi.</p>
<p>Địa bàn đang phục vụ: Xã Chợ Lách, Xã Phú Phụng, Các xã lân cận — liên hệ để biết</p>
<h3>Anh chị muốn làm cộng tác viên HuyData?</h3>

HuyData đang tìm thêm những người ở các xã, khu vực lân cận, ưu tiên người quen địa bàn và có khả năng giao tiếp, hỗ trợ cô chú anh chị tại địa phương.

Công việc có thể làm thêm ngoài giờ, chủ động về thời gian và có hoa hồng theo số hộ phụ trách. HuyData sẽ hướng dẫn công việc, đào tạo nghiệp vụ và hỗ trợ toàn bộ phần chuyên môn.

<h2>Câu hỏi thường gặp</h2>
<h3>Hộ dưới 1 tỷ được miễn thuế rồi, sao còn phải làm sổ?</h3>
<p>Miễn thuế, nhưng không miễn nghĩa vụ ghi sổ và kê khai để chứng minh mình dưới ngưỡng. Không làm vẫn bị phạt. HuyData lo phần ghi sổ và nhắc hạn cho anh chị.</p>
<h3>Không rành máy tính, không rành kế toán có dùng được không?</h3>
<p>Được. HuyData thiết lập sẵn mọi thứ. Mỗi ngày anh chị chỉ nói món hàng vào điện thoại và gõ số tiền.</p>
<h3>Đã có app miễn phí rồi, sao còn phải trả tiền?</h3>
<p>App miễn phí chỉ là công cụ — anh chị vẫn phải tự hiểu, tự ghi, tự khai. HuyData khác ở chỗ có người thật thiết lập sẵn, hướng dẫn tận nơi và đồng hành từng kỳ. Anh chị trả cho sự yên tâm.</p>
<h3>Vì sao trả theo tháng/quý chứ không mua đứt một lần?</h3>
<p>Vì sổ sách là việc làm liên tục mỗi tháng, mỗi quý, mỗi năm. HuyData đồng hành đều đặn, không phải bán một lần rồi để anh chị tự xoay sở.</p>
<h3>Dữ liệu của tôi có an toàn không?</h3>
<p>Có. HuyData chỉ dùng để làm sổ doanh thu cho anh chị, không chia sẻ cho bên thứ ba, tuân thủ pháp luật bảo vệ dữ liệu cá nhân.</p>
<h3>Lỡ HuyData làm trễ hoặc làm sai thì sao?</h3>
<p>HuyData chịu trách nhiệm phần việc của mình: làm lại cho đúng, không tính thêm phí, và đi cùng anh chị khi cần giải trình số liệu. HuyData không hứa “không bao giờ bị phạt” — việc xử phạt thuộc thẩm quyền cơ quan thuế và còn phụ thuộc số liệu anh chị cung cấp. Cái HuyData cam kết được là số liệu ghi đúng, đủ và đúng hạn.</p>
<h3>Giờ cơ quan thuế đã hỏi tới rồi mới kêu, có làm được không?</h3>
<p>Được. Anh chị nhắn Zalo càng sớm càng tốt để HuyData xem hồ sơ đang tới đâu. Trường hợp đã phát sinh chậm trễ thì phải xử lý phần cũ trước rồi mới vào nếp — HuyData sẽ nói rõ mất bao lâu và tốn thêm bao nhiêu ngay từ đầu, không để anh chị bất ngờ.</p>
<h3>Muốn ngưng giữa chừng thì sao? Dữ liệu của tôi thế nào?</h3>
<p>Anh chị ngưng lúc nào cũng được, không ràng buộc hợp đồng dài hạn. HuyData bàn giao lại toàn bộ sổ sách và số liệu đã làm để anh chị giữ hoặc đưa cho đơn vị khác. Phần đã đóng cho kỳ đang làm dở thì HuyData làm cho trọn kỳ đó.</p>
<h3>Ai là người trực tiếp làm sổ cho hộ của tôi?</h3>
<p>Trần Huy — 20 năm trong nghề kế toán – thuế, cùng nền tảng thống kê — chịu trách nhiệm chuyên môn. Cộng tác viên tại xã là người gặp mặt, hướng dẫn và hỗ trợ tận nơi. Anh chị luôn biết mình đang làm việc với ai.</p>
<h3>Muốn tư vấn hoặc đăng ký thì liên hệ ai?</h3>

<h2>Về HuyData</h2>

<p>HuyData không sinh ra từ một phòng họp khởi nghiệp. HuyData lớn lên từ công việc thật trong ngành kế toán, cùng nền tảng thống kê: những buổi gỡ rối sổ sách, những mùa quyết toán, và những lần cô chú anh chị hỏi “giờ tôi phải làm sao?”.

kinh doanh nào của khách."},"process":{"enabled":true,"showPhoto":false,"eyebrow":"Quy trình","title":"Anh chị sẽ được làm việc như thế nào","intro":"Giải pháp là thứ không cầm được trên tay, nên HuyData ghi rõ ra đây từng bước — để anh chị biết trước mình sẽ nhận được gì, ai làm, làm lúc nào.","steps":[{"k":"Bước 1","title":"Gặp mặt, nghe anh chị kể","desc":"Cộng tác viên trong xã tới tận nơi, chỉ hỏi anh chị bán gì, mỗi ngày bao nhiêu lượt, đang vướng ở đâu."},{"k":"Bước 2","title":"HuyData thiết lập sẵn","desc":"HuyData nhập giúp thông tin định danh hộ và toàn bộ danh mục mặt hàng. Anh chị không phải khai báo gì, không phải học phần mềm, không phải học kế toán."},{"k":"Bước 3","title":"Hướng dẫn tận nhà","desc":"Cầm điện thoại của chính anh chị, chỉ tận tay tới khi tự làm được. Chỉ có hai thao tác: nói tên món hàng hoặc chọn món hàng sau đó gõ số tiền."},{"k":"Bước 4","title":"Mỗi ngày ghi doanh thu","desc":"Bán xong ghi liền, chừng vài giây. Quên một hôm cũng không sao — ghi bù được."},{"k":"Bước 5","title":"Cuối tháng HuyData rà soát","desc":"HuyData đối chiếu số liệu, phát hiện chỗ ghi thiếu hoặc bất thường và gọi lại hỏi anh chị cho rõ trước khi chốt sổ."},{"k":"Bước 6","title":"Nhận sổ tháng","desc":"HuyData gửi sổ doanh thu tháng qua Zalo, kèm vài dòng nhận xét dễ hiểu — tháng này bán khá hơn hay chậm hơn, đang cách ngưỡng bao xa."},{"k":"Bước 7","title":"Chuẩn bị sẵn số liệu, nhắc trước hạn","desc":"Tới kỳ, HuyData chuẩn bị sẵn số liệu và nhắc anh chị trước hạn. Không để anh chị tự nhớ ngày."}],"sampleTitle":"Sổ tháng anh chị nhận được","sampleBody":"Mỗi tháng HuyData gửi một bản sổ doanh thu qua Zalo. Không phải file lằng nhằng — mở ra là đọc được, cần thì in ra cất.","samplePhoto":"","samplePhotoAlt":"Ảnh chụp mẫu sổ doanh thu tháng (đã che số liệu khách hàng)"},"ctv":{"enabled":true,"showPhotos":false,"showMembers":false,"areas":["Xã Chợ Lách","Xã Phú Phụng","Các xã lân cận — liên hệ để biết"],"eyebrow":"Người của HuyData tại địa bàn","title":"Cộng tác viên — người trong xóm, không phải tổng đài","intro":"HuyData có những người cộng tác ngay tại địa phương, quen đường, quen địa bàn và hiểu công việc của cô chú anh chị. Có gì cần hỏi, cần hỗ trợ thì cứ liên hệ người phụ trách gần mình, cần thiết có thể gặp trực tiếp, không phải gọi tổng đài rồi chờ đợi.\n","members":[{"name":"(Điền tên cộng tác viên)","area":"xã Chợ Lách","photo":"","photoAlt":"Ảnh cộng tác viên phụ trách xã Chợ Lách","note":"(Điền một dòng giới thiệu — vd: nhiều năm làm điều tra viên thống kê tại địa bàn.)"},{"name":"(Điền tên cộng tác viên)","area":"xã Phú Phụng","photo":"","photoAlt":"Ảnh cộng tác viên phụ trách xã Phú Phụng","note":"(Điền một dòng giới thiệu ngắn.)"},{"name":"(Điền tên cộng tác viên)","area":"(Điền tên xã)","photo":"","photoAlt":"Ảnh cộng tác viên","note":"(Điền một dòng giới thiệu ngắn.)"},{"name":"(Điền tên cộng tác viên)","area":"(Điền tên xã)","photo":"","photoAlt":"Ảnh cộng tác viên","note":"(Điền một dòng giới thiệu ngắn.)"}],"ctaTitle":"Anh chị muốn làm cộng tác viên HuyData?","ctaBody":"HuyData đang tìm thêm cộng tác viên\n\nHuyData đang tìm thêm những người ở các xã, khu vực lân cận, ưu tiên người quen địa bàn và có khả năng giao tiếp, hỗ trợ cô chú anh chị tại địa phương.\n\nCông việc có thể làm thêm ngoài giờ, chủ động về thời gian và có hoa hồng theo số hộ phụ trách. HuyData sẽ hướng dẫn công việc, đào tạo nghiệp vụ và hỗ trợ toàn bộ phần chuyên môn.\n\nNếu anh chị là người địa phương, thích công việc linh hoạt và muốn có thêm một nguồn thu nhập, có thể liên hệ với HuyData để trao đổi cụ thể.\n","ctaText":"Nhắn Zalo tìm hiểu"},"more":{"enabled":true,"eyebrow":"Ngoài giải pháp CaPi - Sổ doanh thu","title":"HuyData còn làm gì","intro":"HuyData tập trung vào giải pháp Capi - Sổ doanh thu cho hộ kinh doanh — đó là việc chính. Ngoài ra còn vài công cụ đã làm và đang dùng thật trong nghề. ","items":[{"name":"App tải hóa đơn điện tử","tag":"Cho hộ kinh doanh","desc":"Tải hàng loạt hóa đơn điện tử đầu vào, gom về một chỗ — khỏi phải mở từng tờ để tải."},{"name":"Phần mềm kế toán","tag":"Cho hộ lớn \u0026 kế toán dịch vụ","desc":"Phần mềm kế toán đơn giản cho doanh nghiệp siêu nhỏ, hạch toán tự động hầu hết các bút toán, kết xuất sổ Nhật ký chung và các sổ cái."},{"name":"Ứng dụng quản lý kho, xử lý XML","tag":"Cho hộ lớn \u0026 kế toán dịch vụ","desc":"Ứng dụng xử lý, nhập liệu hàng loạt hóa đơn xml tự động mà không cần nhập thủ công"}],"note":"Mấy thứ này HuyData làm trong lúc đi làm nghề, không phải sản phẩm đóng gói bán rộng. Anh chị quan tâm cái nào thì nhắn hỏi — HuyData nói thật là dùng được tới đâu."},"privacy":{"eyebrow":"Dữ liệu \u0026 Riêng tư","title":"Dữ liệu của anh chị — HuyData giữ kín.","intro":"Riêng tư là nguyên tắc gốc, không phải khẩu hiệu. Đây là những gì HuyData cam kết.","items":[{"icon":"lock","title":"Chỉ dùng để làm việc cho anh chị","desc":"Dữ liệu bán hàng chỉ dùng để ghi sổ doanh thu cho chính hộ của anh chị."},{"icon":"notrack","title":"Không bán, không chia sẻ","desc":"Dữ liệu của anh chị, HuyData có trách nhiệm giữ gìn. HuyData không bán dữ liệu khách hàng và không sử dụng dữ liệu của anh chị cho mục đích ngoài phạm vi dịch vụ.\n"},{"icon":"db","title":"Tuân thủ pháp luật bảo vệ dữ liệu","desc":"HuyData tuân thủ Luật Bảo vệ dữ liệu cá nhân (Luật 91/2025/QH15)."},{"icon":"chat","title":"Người thật chịu trách nhiệm","desc":"Có người đứng tên, đồng hành và chịu trách nhiệm cùng anh chị — điều phần mềm đơn thuần không thay được."}],"firewallTitle":"Cam kết giữ kín.","firewallBody":"Mọi số liệu anh chị giao cho HuyData đều được bảo mật và chỉ phục vụ đúng công việc sổ sách của anh chị. Không có ngoại lệ."},"about":{"eyebrow":"Về HuyData","quote":"Tôi làm nghề kế toán gần hai mươi năm. Trong từng ấy năm, tôi gặp không ít cô chú anh chị gặp khó khi làm sổ sách, kê khai hay quản lý công việc kinh doanh. HuyData bắt đầu từ mong muốn dùng những gì mình biết để giúp những việc đó trở nên đơn giản hơn.\n","body":"HuyData không sinh ra từ một phòng họp khởi nghiệp. HuyData lớn lên từ công việc thật trong ngành kế toán, cùng nền tảng thống kê: những buổi gỡ rối sổ sách, những mùa quyết toán, và những lần cô chú anh chị hỏi “giờ tôi phải làm sao?”.\n\nTừ những công việc rất thực tế đó, HuyData từng bước xây dựng các giải pháp giúp việc quản lý và kê khai trở nên đơn giản hơn. Với mạng lưới cộng tác viên là những người địa phương, quen địa bàn và hiểu công việc, HuyData muốn đi cùng cô chú anh chị chứ không chỉ đưa cho họ một phần mềm.\nHuyData không chỉ bán phần mềm. HuyData bán sự yên tâm.\n","name":"Trần Quang Huy","role":"Người sáng lập "},"contact":{"eyebrow":"Liên hệ","title":"Cần HuyData lo giúp? Nhắn một tiếng.","sub":"Anh chị cứ nhắn Zalo hoặc gọi trực tiếp cho Huy. Có gì chưa rõ cứ hỏi, HuyData sẽ cùng anh chị xem nhu cầu thực tế rồi chọn giải pháp phù hợp, không cần mua những thứ mình không cần.\n"},"blog":{"enabled":true,"eyebrow":"Bài viết","title":"Góc kiến thức cho hộ kinh doanh","intro":"Những điều hộ kinh doanh cần biết về thuế, sổ sách, hóa đơn từ 2026 — viết dễ hiểu, ví dụ thật.","posts":[{"id":"p1","slug":"bo-thue-khoan-ho-kinh-doanh-duoi-1-ty","title":"Bỏ thuế khoán rồi, hộ kinh doanh dưới 1 tỷ có thật sự không phải lo gì?","metaTitle":"Bỏ thuế khoán, hộ kinh doanh dưới 1 tỷ cần biết gì?","date":"2026-08-15","excerpt":"Hộ kinh doanh dưới 1 tỷ có phải lo gì sau khi bỏ thuế khoán? Giải thích quy định miễn thuế, báo cáo doanh thu và hóa đơn điện tử 2026.","cover":"","published":true,"body":"\u003cp\u003eTôi gặp khá nhiều anh chị nghe câu “bỏ thuế khoán” là bắt đầu lo.\u003c/p\u003e\u003cp\u003eLo nhất không phải vì phải đóng thêm bao nhiêu tiền.\u003cbr\u003eMà là không biết từ nay mình phải làm gì.\u003c/p\u003e\u003cp\u003eTrước đây thuế khoán, cuối tháng hay cuối năm cũng không phải ngồi cộng từng ngày bán được bao nhiêu. Bây giờ nghe nói phải kê khai, phải ghi chép doanh thu, phải làm hồ sơ… là nhiều người nghĩ ngay:\u003c/p\u003e\u003cblockquote\u003e“Chắc từ nay làm như doanh nghiệp rồi.”\u003c/blockquote\u003e\u003cp\u003eKhông hẳn.\u003c/p\u003e\u003cp\u003eNếu hộ kinh doanh có doanh thu năm từ 1 tỷ đồng trở xuống, hiện thuộc nhóm không phải nộp thuế GTGT và thuế TNCN theo ngưỡng mới được quy định. Trước đây 500tr nay đã nâng lên 1 tỷ.\u003c/p\u003e\u003cp\u003eNhưng tôi muốn nói rõ một chuyện:\u003c/p\u003e\u003ch2\u003eMiễn thuế không có nghĩa là miễn việc\u003c/h2\u003e\u003cp\u003eĐây mới là chỗ nhiều hộ kinh doanh dễ nhầm.\u003c/p\u003e\u003cp\u003eKhông phải cứ dưới 1 tỷ là từ nay bán hàng như trước, cuối năm chẳng cần quan tâm gì nữa.\u003c/p\u003e\u003cp\u003eDoanh thu vẫn phải được theo dõi, ghi chép và thực hiện các thủ tục thuế phù hợp với trường hợp của mình. Mẫu biểu, kỳ thông báo và thời hạn cũng phải xem đúng quy định đang áp dụng, chứ không thể nhớ mang máng kiểu “cuối năm nộp một lần là xong”. Trong năm 2026, mẫu 01/TKN-CNKD cũng đã có những lần cập nhật theo các thông tư mới.\u003c/p\u003e\u003ch2\u003eCái khó không nằm ở tiền thuế\u003c/h2\u003e\u003cp\u003eNói chuyện thuế với hộ kinh doanh, tôi thấy cái khó đôi khi không nằm ở tiền thuế.\u003c/p\u003e\u003cp\u003eCái khó nằm ở chuyện:\u003c/p\u003e\u003cul\u003e\u003cli\u003eHôm nay bán được bao nhiêu?\u003c/li\u003e\u003cli\u003eCuối tháng doanh thu là bao nhiêu?\u003c/li\u003e\u003cli\u003eBa tháng trước có ghi thiếu không?\u003c/li\u003e\u003cli\u003eCuối năm lấy số nào để khai?\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eNgười bán hàng không thiếu việc để làm. Sáng mở cửa, nhập hàng, bán hàng, giao hàng, trả hàng, tính tiền… Đến tối còn bắt ngồi nhớ lại hôm nay bán bao nhiêu rồi ghi chép cho đúng thì rất dễ bỏ.\u003c/p\u003e\u003cp\u003eĐến lúc cần số liệu mới mở sổ ra thì lại không nhớ.\u003c/p\u003e\u003cp\u003eĐó mới là cái phiền.\u003c/p\u003e\u003cp\u003eVí dụ một tiệm tạp hóa doanh thu khoảng 700–800 triệu đồng/năm. Với mức doanh thu này, không thể vì nghe “bỏ thuế khoán” mà nghĩ rằng mình phải vận hành như một doanh nghiệp lớn.\u003c/p\u003e\u003cp\u003eNhưng cũng không nên nghĩ:\u003c/p\u003e\u003cblockquote\u003e“Dưới 1 tỷ thì khỏi làm gì.”\u003c/blockquote\u003e\u003cp\u003eCách hiểu đúng phải là:\u003c/p\u003e\u003ch2\u003eThuế có thể không phải nộp, nhưng doanh thu vẫn phải quản lý cho đúng\u003c/h2\u003e\u003cp\u003eTôi nghĩ đây là thay đổi lớn nhất sau khi bỏ thuế khoán.\u003c/p\u003e\u003cp\u003eVà cũng chính từ cái việc rất nhỏ đó mà tôi làm CaPi.\u003c/p\u003e\u003cp\u003eKhông phải để biến một tiệm tạp hóa thành một phòng kế toán.\u003cbr\u003eCũng không phải bắt chủ hộ ngồi nhập liệu cả tiếng mỗi ngày.\u003c/p\u003e\u003cp\u003eChỉ đơn giản là bán hàng thì ghi lại doanh thu.\u003cbr\u003eGhi đều thì cuối kỳ có số liệu.\u003cbr\u003eCó số liệu thì biết mình đang ở đâu.\u003cbr\u003eĐến lúc cần khai thì không phải ngồi lục lại trí nhớ.\u003c/p\u003e\u003cblockquote\u003e\u003cstrong\u003eGhi đúng → Có số liệu → Khai đúng → Đỡ lo.\u003c/strong\u003e\u003c/blockquote\u003e\u003cp\u003eTôi làm CaPi vì thấy hộ kinh doanh nhỏ không cần một hệ thống thật to.\u003c/p\u003e\u003cp\u003eHọ cần một thứ đủ đơn giản để dùng được mỗi ngày và đủ chắc để đến lúc cần thì lấy được số liệu.\u003c/p\u003e\u003cp\u003eNếu anh chị đang kinh doanh dưới 1 tỷ/năm mà vẫn chưa rõ mình thuộc nhóm nào, phải ghi chép gì và cần làm thủ tục gì, cứ hỏi.\u003c/p\u003e\u003cp\u003eTôi sẽ nói thẳng trường hợp nào cần làm, trường hợp nào không.\u003cbr\u003eKhông cần mua gì trước.\u003c/p\u003e"}]},"pricing":{"enabled":true,"eyebrow":"Bảng giá","title":"Chi phí — rõ ràng, theo quy mô hộ","intro":"Chỉ một gói đồng hành duy nhất, theo quy mô hộ. Phí thiết lập một lần 200.000 – 300.000đ/hộ — HuyData làm sẵn định danh và danh mục mặt hàng.","note":"Từ gói Theo Quý trở lên, mỗi hộ mỗi khác nên khảo sát rồi báo giá riêng — thường rẻ hơn nhiều so với thuê một kế toán riêng (3–5tr/tháng). Nhắn Zalo để được tư vấn gói phù hợp.","tiers":[{"name":"Đồng Hành","price":"275.000đ","period":"/ tháng · hộ dưới 1 tỷ","desc":"Ghi sổ doanh thu hằng tháng, nhắc hạn cả năm và có người đồng hành — chưa tới ly cà phê mỗi ngày.","features":["Sổ tháng + nhắc hạn năm","Nhắc hạn tận nơi","Trả quý ~825k, hoặc trả năm tặng 1 tháng"],"cta":"Nhắn Zalo đăng ký","ctaLink":"","highlight":true,"badge":"Phổ biến"},{"name":"Theo Quý","price":"Liên hệ","period":"hộ trên 1 tỷ · tự xuất HĐ","desc":"Sổ sách theo quý cho hộ trên 1 tỷ, có người đồng hành từng kỳ.","features":["Sổ theo quý","Đồng hành theo kỳ"],"cta":"Nhận báo giá","ctaLink":"","highlight":false,"badge":""},{"name":"Theo Quý + Hóa Đơn","price":"Liên hệ","period":"hộ trên 1 tỷ · cần hóa đơn điện tử","desc":"Trọn gói sổ theo quý, kèm hỗ trợ phát hành hóa đơn điện tử.","features":["Sổ theo quý","Hỗ trợ xuất hóa đơn điện tử"],"cta":"Nhận báo giá","ctaLink":"","highlight":false,"badge":""},{"name":"Quyết Toán","price":"Liên hệ","period":"hộ trên 3 tỷ","desc":"Trọn gói kèm tổng hợp số liệu quyết toán năm — khảo sát rồi báo giá riêng.","features":["Trọn gói + tổng hợp quyết toán năm","Khảo sát theo hồ sơ"],"cta":"Trao đổi nhu cầu","ctaLink":"","highlight":false,"badge":""}]},"faq":{"enabled":true,"eyebrow":"Hỏi đáp","title":"Câu hỏi thường gặp","intro":"Những điều anh chị hay hỏi trước khi bắt đầu.","items":[{"q":"Hộ dưới 1 tỷ được miễn thuế rồi, sao còn phải làm sổ?","a":"Miễn thuế, nhưng không miễn nghĩa vụ ghi sổ và kê khai để chứng minh mình dưới ngưỡng. Không làm vẫn bị phạt. HuyData lo phần ghi sổ và nhắc hạn cho anh chị."},{"q":"Không rành máy tính, không rành kế toán có dùng được không?","a":"Được. HuyData thiết lập sẵn mọi thứ. Mỗi ngày anh chị chỉ nói món hàng vào điện thoại và gõ số tiền."},{"q":"Đã có app miễn phí rồi, sao còn phải trả tiền?","a":"App miễn phí chỉ là công cụ — anh chị vẫn phải tự hiểu, tự ghi, tự khai. HuyData khác ở chỗ có người thật thiết lập sẵn, hướng dẫn tận nơi và đồng hành từng kỳ. Anh chị trả cho sự yên tâm."},{"q":"Vì sao trả theo tháng/quý chứ không mua đứt một lần?","a":"Vì sổ sách là việc làm liên tục mỗi tháng, mỗi quý, mỗi năm. HuyData đồng hành đều đặn, không phải bán một lần rồi để anh chị tự xoay sở."},{"q":"Dữ liệu của tôi có an toàn không?","a":"Có. HuyData chỉ dùng để làm sổ doanh thu cho anh chị, không chia sẻ cho bên thứ ba, tuân thủ pháp luật bảo vệ dữ liệu cá nhân."},{"q":"Lỡ HuyData làm trễ hoặc làm sai thì sao?","a":"HuyData chịu trách nhiệm phần việc của mình: làm lại cho đúng, không tính thêm phí, và đi cùng anh chị khi cần giải trình số liệu. HuyData không hứa “không bao giờ bị phạt” — việc xử phạt thuộc thẩm quyền cơ quan thuế và còn phụ thuộc số liệu anh chị cung cấp. Cái HuyData cam kết được là số liệu ghi đúng, đủ và đúng hạn."},{"q":"Giờ cơ quan thuế đã hỏi tới rồi mới kêu, có làm được không?","a":"Được. Anh chị nhắn Zalo càng sớm càng tốt để HuyData xem hồ sơ đang tới đâu. Trường hợp đã phát sinh chậm trễ thì phải xử lý phần cũ trước rồi mới vào nếp — HuyData sẽ nói rõ mất bao lâu và tốn thêm bao nhiêu ngay từ đầu, không để anh chị bất ngờ."},{"q":"Muốn ngưng giữa chừng thì sao? Dữ liệu của tôi thế nào?","a":"Anh chị ngưng lúc nào cũng được, không ràng buộc hợp đồng dài hạn. HuyData bàn giao lại toàn bộ sổ sách và số liệu đã làm để anh chị giữ hoặc đưa cho đơn vị khác. Phần đã đóng cho kỳ đang làm dở thì HuyData làm cho trọn kỳ đó."},{"q":"Ai là người trực tiếp làm sổ cho hộ của tôi?","a":"Trần Huy — 20 năm trong nghề kế toán – thuế, cùng nền tảng thống kê — chịu trách nhiệm chuyên môn. Cộng tác viên tại xã là người gặp mặt, hướng dẫn và hỗ trợ tận nơi. Anh chị luôn biết mình đang làm việc với ai."},{"q":"Muốn tư vấn hoặc đăng ký thì liên hệ ai?","a":"Nhắn Zalo 0917 324 328 hoặc gọi trực tiếp — HuyData tư vấn gói phù hợp với hộ của anh chị. Tư vấn miễn phí, không ràng buộc."}]}}</script>

function deepMerge(base,over){
  if(over===null||over===undefined) return base;
  if(Array.isArray(over)) return over;
  if(typeof over!=="object") return over;
  var out=Array.isArray(base)?base.slice():Object.assign({},base);
  for(var k in over){ out[k]=deepMerge(base?base[k]:undefined, over[k]); }
  return out;
}

function sanitize(html, mode){
  var allow = mode==="inline"
    ? {BR:[],EM:[],I:[],STRONG:[],B:[],SPAN:["class"]}
    : {P:[],BR:[],H2:[],H3:[],STRONG:[],B:[],EM:[],I:[],U:[],A:["href","target","rel"],UL:[],OL:[],LI:[],BLOCKQUOTE:[],IMG:["src","alt"],DIV:[],SPAN:["class"]};
  var doc=new DOMParser().parseFromString("<div>"+(html||"")+"</div>","text/html");
  var root=doc.body.firstChild;
  function walk(node){
    Array.prototype.slice.call(node.childNodes).forEach(function(ch){
      if(ch.nodeType===3) return;
      if(ch.nodeType!==1){ ch.remove(); return; }
      var tag=ch.tagName;
      if(!allow[tag]){ var f=doc.createDocumentFragment(); while(ch.firstChild)f.appendChild(ch.firstChild); ch.replaceWith(f); return; }
      Array.prototype.slice.call(ch.attributes).forEach(function(at){
        var ok=allow[tag].indexOf(at.name)>=0;
        if(!ok || /^on/i.test(at.name)){ ch.removeAttribute(at.name); return; }
        if((at.name==="href"||at.name==="src") && /^\s*javascript:/i.test(at.value)) ch.removeAttribute(at.name);
        if(tag==="SPAN" && at.name==="class" && at.value.indexOf("em")<0) ch.removeAttribute("class");
      });
      if(tag==="A" && ch.getAttribute("href")){ ch.setAttribute("target","_blank"); ch.setAttribute("rel","noopener noreferrer"); }
      walk(ch);
    });
  }
  walk(root);
  return root.innerHTML;
}

(function(){
  var canvas=$("#constellation"); if(!canvas)return;
  var ctx=canvas.getContext('2d'),dpr=Math.min(window.devicePixelRatio||1,2),W=0,H=0,nodes=[],raf=null,running=false,visible=true,LINK=132;
  function count(){var a=window.innerWidth*window.innerHeight;return Math.max(26,Math.min(64,Math.round(a/26000)));}
  function size(){var r=canvas.getBoundingClientRect();W=Math.round(r.width);H=Math.round(r.height);
    if(!W||!H)return false;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);return true;}
  function seed(){nodes=[];var n=count();for(var i=0;i<n;i++)nodes.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.22,vy:(Math.random()-.5)*.22,r:Math.random()*1.6+1});}
  function paint(move){ctx.clearRect(0,0,W,H);
    if(move)for(var i=0;i<nodes.length;i++){var p=nodes[i];p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;}
    for(var a=0;a<nodes.length;a++)for(var b=a+1;b<nodes.length;b++){var dx=nodes[a].x-nodes[b].x,dy=nodes[a].y-nodes[b].y,dd=Math.sqrt(dx*dx+dy*dy);if(dd<LINK){var o=(1-dd/LINK)*.5;ctx.strokeStyle='rgba(116,198,157,'+o.toFixed(3)+')';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(nodes[a].x,nodes[a].y);ctx.lineTo(nodes[b].x,nodes[b].y);ctx.stroke();}}
    for(var k=0;k<nodes.length;k++){var q=nodes[k];ctx.fillStyle='rgba(45,212,168,.85)';ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,Math.PI*2);ctx.fill();}}
  function frame(){if(!running)return;paint(true);raf=requestAnimationFrame(frame);}
  function start(){if(running||reduce||!W||!H||!visible)return;running=true;raf=requestAnimationFrame(frame);}
  function stop(){running=false;if(raf)cancelAnimationFrame(raf);raf=null;}
  /* đo lại từ đầu: lúc script chạy trang có thể chưa xong bố cục, đo hụt là canvas rộng 0 và không vẽ được gì */
  function build(){stop();if(!size())return;seed();if(reduce)paint(false);else start();}
  build();
  if(document.readyState!=="complete")window.addEventListener("load",build);
  document.addEventListener('visibilitychange',function(){document.hidden?stop():start();});
  if('IntersectionObserver' in window)new IntersectionObserver(function(e){visible=e[0].isIntersecting;visible?start():stop();},{threshold:0}).observe(canvas);
  if('ResizeObserver' in window){var rob=null;new ResizeObserver(function(){clearTimeout(rob);rob=setTimeout(build,180);}).observe(canvas);}
  else{var rt=null;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(build,200);});}
})();

async function sha256(str){
  var buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str));
  return Array.prototype.map.call(new Uint8Array(buf),function(b){return b.toString(16).padStart(2,"0");}).join("");
}

            lw.innerHTML='<label>'+esc(f.l)+' <span class="sub">— mỗi dòng một ý</span></label><textarea rows="'+(f.rows||3)+'"></textarea>';

            ta.addEventListener("input",function(){ item[f.k]=ta.value.split("\n").map(function(x){return x.trim();}).filter(Boolean); renderAll(); scheduleDraft(); });
            card.appendChild(lw); return;
          }
          if(f.bool){

            bw.innerHTML='<label style="cursor:pointer"><input type="checkbox" style="width:auto;margin-right:8px;vertical-align:middle" '+(item[f.k]?"checked":"")+'>'+esc(f.l)+'</label>';

          card.appendChild(fld(f.l,item[f.k],function(v){item[f.k]=v;},{
            textarea:f.textarea,rows:f.rows,type:f.type,ph:f.ph,
            select: f.icon?iconOptions():(f.select||null)
          }));
        });
      }
      hd.querySelector('[data-a=up]').onclick=function(){if(idx>0){arr.splice(idx-1,0,arr.splice(idx,1)[0]);refresh();renderAll();scheduleDraft();}};
      hd.querySelector('[data-a=down]').onclick=function(){if(idx<arr.length-1){arr.splice(idx+1,0,arr.splice(idx,1)[0]);refresh();renderAll();scheduleDraft();}};
      hd.querySelector('[data-a=del]').onclick=function(){if(confirm("Xóa mục này?")){arr.splice(idx,1);refresh();renderAll();scheduleDraft();}};
      list.appendChild(card);
    });
    var add=document.createElement("button"); add.className="addbtn";
    add.innerHTML='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg> '+(opt.addLabel||"Thêm mục");
    add.onclick=function(){ opt.add(); refresh(); renderAll(); scheduleDraft(); };
    list.appendChild(add);
  }
  refresh();
  return wrap;
}

function plainSnapshot(){
  // Bản chữ thuần của trang, dành cho trình quét không chạy JS (Zalo, Facebook, Cốc Cốc, Bing).
  // Nội dung y hệt bản người đọc thấy — không phải kỹ thuật che giấu.
  var c=content, s=c.settings, out=[];
  function esq(x){return String(x==null?"":x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  function H(n,t){ t=String(t==null?"":t).trim(); if(!t||/^\(\s*Điền/i.test(t)) return; out.push("<h"+n+">"+esq(stripTags(sanitize(t.replace(/<br\s*\/?>/gi," "),"inline")))+"</h"+n+">"); }
  function real(t){ t=String(t==null?"":t).trim(); return /^\(\s*Điền/i.test(t)?"":t; }
  function P(t){ t=real(t); if(t) out.push("<p>"+esq(t)+"</p>"); }
  function UL(a,f){ if(!a||!a.length) return; var li=a.map(function(x){return real(f(x)).replace(/\s*—\s*$/,"").replace(/^\s*—\s*/,"");}).filter(Boolean);
    if(li.length) out.push("<ul>"+li.map(function(x){return "<li>"+esq(x)+"</li>";}).join("")+"</ul>"); }
  H(1,c.hero.title); if(c.hero.kw) H(2,c.hero.kw); P(c.hero.sub);
  P(String(s.brandName||"HuyData")+" — "+(s.sub||"")+". "+(s.slogan||"")+(s.coSlogan?" "+s.coSlogan:""));
  H(2,c.pain.title); P(c.pain.intro); UL(c.pain.items,function(x){return x.title+" — "+x.desc;});
  H(2,c.why.title); P(c.why.intro); UL(c.why.cards,function(x){return x.title+" — "+x.desc;});
  if(c.solutions&&c.solutions.enabled!==false){ H(2,c.solutions.title); P(c.solutions.intro);
    (c.solutions.groups||[]).forEach(function(g){ H(3,g.name); P(g.tagline); UL(g.items,function(x){return x.name+" — "+x.desc;}); }); }
  if(c.pricing&&c.pricing.enabled!==false){ H(2,c.pricing.title); P(c.pricing.intro);
    UL(c.pricing.tiers,function(t){return t.name+": "+t.price+" "+(t.period||"")+" — "+(t.desc||"");}); P(c.pricing.note); }
  H(2,c.decision.title); P(c.decision.intro); UL(c.decision.rungs,function(x){return x.title+" — "+x.desc;});
  H(2,c.who.title); P(c.who.intro); UL(c.who.cards,function(x){return x.title+" — "+x.desc;});
  if(c.stories&&c.stories.enabled!==false){ H(2,c.stories.title); P(c.stories.intro);
    (c.stories.items||[]).forEach(function(x){ H(3,x.name+" — "+x.place); P(x.biz); P(x.quote); }); P(c.stories.note); }
  if(c.process&&c.process.enabled!==false){ H(2,c.process.title); P(c.process.intro);
    UL(c.process.steps,function(x){return x.k+": "+x.title+" — "+x.desc;}); H(3,c.process.sampleTitle); P(c.process.sampleBody); }
  if(c.ctv&&c.ctv.enabled!==false){ H(2,c.ctv.title); P(c.ctv.intro);
    if(c.ctv.showMembers===true) UL(c.ctv.members,function(x){return [real(x.name),real(x.area),real(x.note)].filter(Boolean).join(" — ");});
    else if((c.ctv.areas||[]).length) P("Địa bàn đang phục vụ: "+c.ctv.areas.map(real).filter(Boolean).join(", "));
    H(3,c.ctv.ctaTitle); P(c.ctv.ctaBody); }
  var pp=pubPosts();
  if(pp.length){ H(2,(c.blog&&c.blog.title)||"Bài viết");
    out.push("<ul>"+pp.map(function(p){return '<li><a href="'+esq(postPath(p.slug))+'">'+esq(p.title)+"</a> — "+esq(p.excerpt||"")+"</li>";}).join("")+"</ul>"); }
  if(c.more&&c.more.enabled!==false){ H(2,c.more.title); P(c.more.intro);
    UL(c.more.items,function(x){return x.name+(realVal(x.desc)?" — "+realVal(x.desc):"");}); P(c.more.note); }
  H(2,c.privacy.title); P(c.privacy.intro); UL(c.privacy.items,function(x){return x.title+" — "+x.desc;});
  if(c.faq&&c.faq.enabled!==false){ H(2,c.faq.title);
    (c.faq.items||[]).forEach(function(x){ H(3,x.q); P(x.a); }); }
  H(2,c.about.eyebrow); P(c.about.quote); P(c.about.body);
  H(2,c.contact.title); P(c.contact.sub);
  var lg=s.legal||{};
  P([real(lg.entity),real(lg.taxCode)?("Mã số hộ kinh doanh "+real(lg.taxCode)):"",real(lg.address),real(lg.owner)].filter(Boolean).join(" · "));
  P("Liên hệ: Zalo "+(s.zaloText||"")+" · Điện thoại "+(s.phoneText||"")+" · "+(s.email||""));
  return out.join("\n");
}
function seoFiles(){
  var u=siteURL(), today=new Date().toISOString().slice(0,10), posts=pubPosts();
  var urls=[{loc:u,pri:"1.0",cf:"weekly",lm:today}];
  if(posts.length){
    urls.push({loc:u+"bai-viet/",pri:"0.7",cf:"weekly",lm:today});
    posts.forEach(function(p){ urls.push({loc:postAbsURL(p.slug),pri:"0.8",cf:"monthly",lm:(p.date||today)}); });
  }
  var sitemap='<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'+
    urls.map(function(x){return "  <url>\n    <loc>"+x.loc+"</loc>\n    <lastmod>"+x.lm+"</lastmod>\n    <changefreq>"+x.cf+"</changefreq>\n    <priority>"+x.pri+"</priority>\n  </url>";}).join("\n")+
    "\n</urlset>\n";
  var robots="User-agent: *\nAllow: /\nDisallow: /_old/\n\nSitemap: "+u+"sitemap.xml\n";
  return {sitemap:sitemap,robots:robots};
}
/* ==================================================================
   XUẤT BẢN SITE NHIỀU TRANG — mỗi bài viết là một trang HTML thật
   Địa chỉ: huydata.vn/bai-viet/<slug>/  (không dùng dấu #)
   Lý do: Google cắt bỏ mọi thứ sau dấu "#", nên bài viết trong bản
   một-file cũ không bao giờ được lập chỉ mục thành trang riêng.
   ================================================================== */

/* ZALO_IC đã khai báo ở trên */

/* ---------- Địa chỉ ---------- */
function siteHost(){ return siteURL().replace(/^https?:\/\//,"").replace(/\/+$/,""); }
function postPath(slug){ return "bai-viet/"+slug+"/"; }
function postAbsURL(slug){ return siteURL()+postPath(slug); }
function pubPosts(){
  return ((content.blog&&content.blog.posts)||[]).filter(function(p){return p.published;})
    .sort(function(a,b){return String(b.date||"").localeCompare(String(a.date||""));});
}
/* Đường dẫn tuyệt đối (cho canonical, og:image, dữ liệu có cấu trúc) */
function absURL(v){
  v=String(v||"").trim(); if(!v) return "";
  if(/^(https?:|data:|\/\/)/i.test(v)) return v;
  return siteURL()+v.replace(/^\/+/,"");
}
/* Đường dẫn tương đối tính từ trang con (up = "../" hoặc "../../") */
function relURL(v,up){
  v=String(v||"").trim(); if(!v) return "";
  if(/^(https?:|data:|mailto:|tel:|#|\/\/)/i.test(v)) return v;
  return up+v.replace(/^\/+/,"");
}
function faviconHref(){ var l=document.querySelector('link[rel="icon"]'); return l?l.getAttribute("href"):""; }
function fontsHref(){ var l=document.querySelector('link[href*="fonts.googleapis.com/css2"]'); return l?l.getAttribute("href"):""; }
function realVal(t){ t=String(t==null?"":t).trim(); return /^\(\s*Điền/i.test(t)?"":t; }

/* ---------- Trang bài viết ---------- */
function buildPostPage(p){
  var s=content.settings, up="../../", url=postAbsURL(p.slug);
  var d=document.createElement("div");
  d.innerHTML=sanitize(p.body,"post");
  /* đổi đường dẫn tương đối trong bài cho đúng với thư mục con */
  Array.prototype.forEach.call(d.querySelectorAll("img[src]"),function(el){ el.setAttribute("src",relURL(el.getAttribute("src"),up)); });
  Array.prototype.forEach.call(d.querySelectorAll("a[href]"),function(el){ el.setAttribute("href",relURL(el.getAttribute("href"),up)); });
  /* mục lục tự động khi bài có từ 3 tiểu mục trở lên */
  var hs=d.querySelectorAll("h2"), toc="";
  if(hs.length>=3){
    var items=[];
    Array.prototype.forEach.call(hs,function(h,i){
      var id="muc-"+(i+1); h.id=id;
      items.push('<li><a href="#'+id+'">'+esc(h.textContent.trim())+'</a></li>');
    });
    toc='<nav class="toc" aria-label="Mục lục"><b>Trong bài này</b><ol>'+items.join("")+'</ol></nav>';
  }
  var body=d.innerHTML;
  var lead=String(p.excerpt||"").trim();
  var desc=(lead||stripTags(p.body).slice(0,155)).trim();
  var rel=pubPosts().filter(function(x){return x.slug!==p.slug;}).slice(0,3);
  var relBlock = rel.length ? '<section class="rel"><h2>Bài viết khác</h2><ul>'+rel.map(function(x){
      return '<li><a href="'+esc(up+postPath(x.slug))+'">'+esc(x.title)+'</a><em>'+esc(x.excerpt||"")+'</em></li>';
    }).join("")+'</ul></section>' : '';
  var cover=p.cover?'<img class="a-cover" src="'+esc(relURL(p.cover,up))+'" alt="'+esc(p.title)+'">':'';

  var graph=[bizNode(),
    {"@type":"Article","@id":url+"#article",
     headline:String(p.title||"").slice(0,110),
     description:desc,
     datePublished:p.date||undefined, dateModified:p.date||undefined,
     inLanguage:"vi-VN",
     author:{"@type":"Person",name:(content.about&&content.about.name)||"Trần Huy"},
     publisher:{"@id":siteURL()+"#huydata"},
     mainEntityOfPage:{"@type":"WebPage","@id":url},
     image:absURL(p.cover||(s.seo&&s.seo.ogImage)||"")||undefined},
    {"@type":"BreadcrumbList","@id":url+"#bc",itemListElement:[
      {"@type":"ListItem",position:1,name:"Trang chủ",item:siteURL()},
      {"@type":"ListItem",position:2,name:"Bài viết",item:siteURL()+"bai-viet/"},
      {"@type":"ListItem",position:3,name:p.title,item:url}]}];

  return staticPage({
    title: (realVal(p.metaTitle)||p.title)+" | "+(s.brandName||"HuyData"),
    desc: desc, canonical: url, ogType:"article",
    image: p.cover||(s.seo&&s.seo.ogImage)||"",
    ld: JSON.stringify({"@context":"https://schema.org","@graph":graph},null,1),
    body: staticHeader(up)+
      '<div class="wrap">'+
      '<nav class="bc" aria-label="Đường dẫn"><a href="'+up+'">Trang chủ</a><span>›</span><a href="'+up+'bai-viet/">Bài viết</a></nav>'+
      '<article>'+
      '<div class="a-date">'+esc(fmtDate(p.date))+'</div>'+
      '<h1>'+esc(p.title)+'</h1>'+
      (lead?'<p class="a-lead">'+esc(lead)+'</p>':'')+
      cover+toc+
      '<div class="prose">'+body+'</div>'+
      ctaBlock()+relBlock+
      '</article></div>'+
      staticFooter(up)
  });
}

/* ---------- Nén ZIP (kiểu store, không nén — đủ dùng và không cần thư viện) ---------- */
var CRC_TABLE=(function(){var t=[],c,n,k;for(n=0;n<256;n++){c=n;for(k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})();
function crc32(buf){var c=0xFFFFFFFF;for(var i=0;i<buf.length;i++)c=CRC_TABLE[(c^buf[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zipMake(files){
  var enc=new TextEncoder(), parts=[], central=[], offset=0;
  function u16(n){return [n&255,(n>>>8)&255];}
  function u32(n){return [n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255];}
  files.forEach(function(f){
    var name=enc.encode(String(f.name).replace(/\\/g,"/"));   // ZIP luôn dùng dấu /
    var data=enc.encode(String(f.data==null?"":f.data));
    var crc=crc32(data);
    var loc=[].concat(u32(0x04034b50),u16(20),u16(0x0800),u16(0),u16(0),u16(33),
                      u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0));
    parts.push(new Uint8Array(loc),name,data);
    central.push({name:name,crc:crc,len:data.length,off:offset});
    offset+=loc.length+name.length+data.length;
  });
  var cdir=[], cstart=offset;
  central.forEach(function(c){
    var h=[].concat(u32(0x02014b50),u16(20),u16(20),u16(0x0800),u16(0),u16(0),u16(33),
                    u32(c.crc),u32(c.len),u32(c.len),u16(c.name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(c.off));
    cdir.push(new Uint8Array(h),c.name);
    offset+=h.length+c.name.length;
  });
  var end=new Uint8Array([].concat(u32(0x06054b50),u16(0),u16(0),u16(central.length),u16(central.length),
                                   u32(offset-cstart),u32(cstart),u16(0)));
  return new Blob(parts.concat(cdir,[end]),{type:"application/zip"});
}
function downloadBlob(name,blob){
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(url);a.remove();},800);
}

/* ---------- Gói toàn bộ site ---------- */
function publishSite(){
  var f=seoFiles(), posts=pubPosts();
  var files=[
    {name:"index.html",   data:bakedIndex()},
    {name:"404.html",     data:build404Page()},
    {name:"sitemap.xml",  data:f.sitemap},
    {name:"robots.txt",   data:f.robots},
    {name:"CNAME",        data:siteHost()+"\n"},
    {name:".nojekyll",    data:""}
  ];
  if(posts.length){
    files.push({name:"bai-viet/index.html",data:buildBlogIndexPage()});
    posts.forEach(function(p){ files.push({name:postPath(p.slug)+"index.html",data:buildPostPage(p)}); });
  }
  downloadBlob("huydata-site.zip", zipMake(files));
  toast("Đã tải huydata-site.zip — "+files.length+" file, "+posts.length+" trang bài viết. Giải nén rồi tải TOÀN BỘ lên hosting.");
}

/* ---------- Trang chủ đã nướng sẵn nội dung cho trình quét ---------- */
function bakedIndex(){
  var jsonSafe=JSON.stringify(content).replace(/</g,"\\u003c").replace(/>/g,"\\u003e").replace(/&/g,"\\u0026");
  var out=SHELL.replace(/(<script id="site-content" type="application\/json">)[\s\S]*?(<\/script>)/, function(_,a,z){ return a+jsonSafe+z; });
  var s=content.settings, seo=s.seo||{}, h=content.hero;
  var t=(seo.title||(String(s.brandName||"HuyData")+" — "+stripTags(sanitize(h.title,"inline")))).trim();
  var d=(seo.description||h.sub||"").trim();
  var img=absURL(seo.ogImage||"");
  function attr(v){ return String(v||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function setContent(id,val){ out=out.replace(new RegExp('(<[^>]*id="'+id+'"[^>]*content=")[^"]*(")'), '$1'+attr(val)+'$2'); }
  out=out.replace(/(<title id="page-title">)[\s\S]*?(<\/title>)/, '$1'+attr(t)+'$2');
  setContent("meta-desc",d); setContent("og-title",t); setContent("og-desc",d);
  setContent("tw-title",t); setContent("tw-desc",d);
  if(img){ setContent("og-img",img); setContent("tw-img",img); }
  out=out.replace(/(<link id="canonical" rel="canonical" href=")[^"]*(")/, '$1'+attr(siteURL())+'$2');
  out=out.replace(/(<script type="application\/ld\+json" id="ld-json">)[\s\S]*?(<\/script>)/,
    function(_,a,z){ return a+buildLD().replace(/</g,"\\u003c")+z; });
  out=out.replace(/(<noscript id="nojs-content">)[\s\S]*?(<\/noscript>)/,
    function(_,a,z){ return a+plainSnapshot()+z; });
  return out;
}
function exportHTML(){
  download("HuyData_Website.html",bakedIndex(),"text/html");
  toast("Đã tải trang chủ (.html). Có bài viết thì nên dùng \"Xuất bản site (.zip)\" để mỗi bài có trang riêng.");
}
