<script>
/* SPA GitHub Pages — giải mã deep-link do 404.html chuyển thành query (?/...).
   PHẢI chạy trước mọi tài nguyên tương đối: đặt <base> = thư mục gốc site để
   css/js/json phân giải đúng, rồi khôi phục URL sạch bằng replaceState. Không làm
   gì trên lượt tải bình thường (khi không có "?/"). */
(function(l){
  if (l.search.charAt(1) === "/") {
    document.write('<base href="' + l.pathname + '">');
    var decoded = l.search.slice(1).split("&").map(function(s){ return s.replace(/~and~/g, "&"); }).join("?");
    history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
  }
})(window.location);
</script>
